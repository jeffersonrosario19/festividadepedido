
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cardápio Online - anota aí</title>
  <link href="styles.css" rel="stylesheet" />
</head>
<body>

  <!-- ==================== CABEÇALHO ==================== -->
  <header>
    <h1>Cardápio</h1>
  </header>

  <!-- ==================== SEÇÃO DE PRATOS ==================== -->
  <section>
    <div class="category-title" data-categoria="pratos" onclick="toggleGrid('pratos')"><span>Pratos Típicos</span><span class="category-count" aria-label="Quantidade de produtos"></span></div>
    <div id="pratos" class="grid">
    </div>
  </section>

  <!-- ==================== SEÇÃO DE BOLOS ==================== -->
  <section>
    <div class="category-title" data-categoria="bolos" onclick="toggleGrid('bolos')"><span>Bolos e doces</span><span class="category-count" aria-label="Quantidade de produtos"></span></div>
    <div id="bolos" class="grid hidden">
    </div>
  </section>

  <!-- ==================== SEÇÃO DE BEBIDAS ==================== -->
  <section>
    <div class="category-title" data-categoria="bebidas" onclick="toggleGrid('bebidas')"><span>Bebidas</span><span class="category-count" aria-label="Quantidade de produtos"></span></div>
    <div id="bebidas" class="grid hidden">
    </div>
  </section>

  <!-- ==================== RODAPÉ COM BOTÃO DO CARRINHO ==================== -->
  <footer class="footer-fixo">
    <button type="button" class="botao-carrinho" onclick="mostrarResumo()" aria-label="Ver carrinho, 0 itens, total R$ 0,00">
      <span class="carrinho-info"><img class="icone-car" src="img/icone_car.svg" alt="" /><span><span class="carrinho-titulo">Carrinho</span><span id="carrinho-quantidade" class="carrinho-quantidade">0 itens</span></span></span>
      <span class="badge-total" role="status" aria-live="polite" aria-atomic="true"><span class="badge-total-label">Total</span><span id="carrinho-total" class="badge-total-valor">R$ 0,00</span></span>
    </button>
  </footer>
  <!-- ==================== POP-UP DE QUANTIDADE ==================== -->
  <div id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="popup-conteudo">
      <h2 id="popup-title">Ajustar quantidade</h2>
      <p id="popup-produto" class="quantidade-produto"></p>
      <p class="quantidade-instrucao">Use os botões − e + para ajustar.</p>
      <div class="controle-quantidade" role="group" aria-label="Quantidade do produto">
        <button type="button" class="botao-quantidade" aria-label="Diminuir quantidade" onclick="alterarQuantidade(-1)">−</button>
        <input class="in-quant" type="number" id="popup-input" aria-label="Quantidade" value="1" min="1" step="1" readonly />
        <button type="button" class="botao-quantidade" aria-label="Aumentar quantidade" onclick="alterarQuantidade(1)">+</button>
      </div>

      <div class="botoes">
        <button class="cancelar" onclick="fecharPopup()">Voltar</button>
        <button class="confirmar" onclick="confirmarPopup()">Salvar</button>
      </div>
    </div>
  </div>
 
<!-- ==================== POP-UP DE RESUMO DO PEDIDO ==================== -->
<div id="resumo-pedido" class="popup">
  <div class="popup-conteudo resumo-conteudo">
    <h2>Resumo do Pedido</h2>
    <div id="lista-pedido"></div>
    <div class="botoes">
      <button href="#" class="cancelar" onclick="fecharResumo()">Voltar</button>
      <button href="#" class="confirmar" onclick="abrirPagamento()">Dinheiro</button>
    </div>
  </div>
</div>

<!-- ==================== POP-UP DE PAGAMENTO ==================== -->
<div id="pagamento" class="popup">
  <div class="popup-conteudo" style="max-height: 85vh; overflow-y: auto;">
    <h2>Concluir Pagamento</h2>
    <p class="tt-liquido">Total do pedido: <strong id="pagamento-total"></strong></p>
    <label for="valor-dinheiro" style="font-size: 1.3rem;">Valor em dinheiro:</label>
    <input class="in-dinheiro" type="number" id="valor-dinheiro" min="0" oninput="calcularTroco()" placeholder="R$ 0,00"/>
    <p id="valor-troco" class="valor-troco"></p>
    <div class="botoes">
      <button href="#" class="cancelar" onclick="fecharPagamento()">Voltar</button>
      <button href="#" class="confirmar" onclick="concluirPedido()">Finalizar</button>
    </div>
  </div>
</div>

<!-- ==================== POP-UP MENSAGEM FINAL ==================== -->
<div id="mensagem-final" class="popup">
  <div class="popup-conteudo mensagem">
    <h2>Pedido concluído com sucesso!</h2>
  </div>
</div>

<!-- ==================== POP-UP DE ALERTA (CARRINHO VAZIO) ==================== -->
<div id="popup-alerta-carrinho" class="popup">
  <div class="popup-carVazio">
    <div class="alerta-icone"><img src="img/icone_alerta.svg" alt="Alerta" /></div>
    <h2>Aviso</h2>
    <p>Seu carrinho está vazio.</p>
    <button class="cancelar" onclick="fecharPopupAlerta()">Fechar</button>
  </div>
</div>
  
<!-- ==================== POP-UP DE ALERTA (PAGAMENTO VAZIO) ==================== -->
<div id="popup-alerta-pagamento" class="popup">
  <div class="popup-carVazio">
    <div class="alerta-icone"><img src="img/icone_alerta.svg" alt="Alerta" /></div>
    <h2>Aviso</h2>
    <p>Inserir valor de pagamento.</p>
    <button class="cancelar" onclick="fecharPopuppagamento()">Fechar</button>
  </div>
</div>
  
  <script src="itens.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
